version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: smartread-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smartread
    volumes:
      - mongodb_data:/data/db
    networks:
      - smartread-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: smartread-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smartread-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API (Optional - for containerized deployment)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartread-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/smartread
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=production
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smartread-network
    volumes:
      - ./backend:/app
    profiles:
      - full-stack  # Only start with --profile full-stack

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  smartread-network:
    driver: bridge
